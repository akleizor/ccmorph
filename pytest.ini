[pytest]
# no test over a minute (pytest-timeout; user order 2026-10-16)
# The ceiling is a per-test verdict, never a session killer (#892): the
# default signal method raises pytest.fail() wherever the main thread is, and
# one landing inside report construction kills the whole xdist session
# without naming a test, so tests/conftest.py selects the thread method for
# xdist workers — its worker death is reported as one named FAILED of that
# test and the worker is replaced. Serial runs keep signal, where the handler
# is an ordinary per-test FAILED and there is no dsession to collapse.
timeout = 60
