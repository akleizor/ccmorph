# CI for ccmorph.
#
# There was none, so every green suite was green only because someone ran it by
# hand on one macOS machine. The tool claims macOS and Linux, and the two places
# it has actually broken on Linux (a /bin/zsh shebang, a BSD-only `ln` flag) were
# both invisible to a suite that only ever ran here.
#
# `shellcheck` is deliberately absent: it parses POSIX/bash and misreads zsh's
# own syntax — glob qualifiers like (N), ${(f)} splitting, ${...:A} — so it would
# report noise, not defects. `zsh -n` is the real syntax gate for zsh; the suite
# is the only thing that catches semantic mistakes.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: CI only reads the code, so a PR from anyone cannot use it to write to the repo.
permissions:
  contents: read

# A new push to the same PR cancels the run it replaces; main keeps every run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - name: parse every zsh file
        run: |
          for f in bin/ccmorph lib/ccmorph.sh lib/ccmorph-*.zsh install.sh \
                   tests/ccmorph_test.zsh tests/install_test.zsh; do
            zsh -n "$f" && echo "ok  $f"
          done
      - name: byte-compile every python helper
        run: |
          python3 -m py_compile libexec/ccmorph-adapter libexec/model-window \
                                libexec/refresh-model-registry tests/*.py
      - name: shebangs must find their interpreter via env
        # #!/bin/zsh does not exist where zsh lives in /usr/bin, and both of these
        # run DIRECTLY as executables — install.sh puts `ccmorph` on PATH — so
        # their shebangs are load-bearing on any machine that is not macOS.
        run: |
          for f in bin/ccmorph install.sh; do
            head -1 "$f" | grep -qx '#!/usr/bin/env zsh' \
              || { echo "$f: shebang must be '#!/usr/bin/env zsh'"; exit 1; }
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        # Both libcs (glibc/musl differences are real for zsh globbing and
        # coreutils flags) and macOS, which is where BSD tools live.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A healthy run takes under 10 minutes. Without a cap, one hung test holds the
    # runner for GitHub's 6-hour default and its log stays unreadable until then.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install zsh
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y zsh
          fi
          zsh --version
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet, build and test; build libexec/gateway-shim for the suites below
        run: go vet ./... && go build ./... && go test ./... && make shim
      - name: zsh suite
        run: zsh tests/ccmorph_test.zsh
      - name: installer suite
        run: zsh tests/install_test.zsh
      # pytest was never installed here, so this step had never run a test. The
      # runner's own python3 is externally managed on macOS (PEP 668), so use a
      # setup-python interpreter that pip may install into.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: python suite
        run: |
          python -m pip install pytest pytest-timeout
          # -v names each test as it runs, so a log cut off by the cap above still
          # shows where it stopped; --durations names the slow ones on a full run.
          python -m pytest tests/ -v --durations=25
      - name: adapter tests against the Go port (ccmorph-core adapter)
        run: CCMORPH_TEST_ADAPTER=go python -m pytest tests/adapter_test.py tests/adapter_auto_test.py -q
      - name: helper tests against the Go ports (ccmorph-core settings-compose, model-window, refresh-model-registry)
        run: CCMORPH_TEST_HELPERS=go python -m pytest tests/settings_compose_test.py tests/model_window_test.py tests/context_override_test.py tests/cli_model_selection_test.py tests/refresh_probe_test.py tests/registry_cli_test.py -q

  python-floor:
    # The floor is 3.8. Prove the Python helpers still import there — the failure
    # this guards against surfaced days after install, inside a child process, as
    # a bare SyntaxError.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Most Python tests drive the zsh library; the Ubuntu image ships no zsh.
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make shim
      - run: |
          python -m pip install pytest pytest-timeout "backports.zoneinfo; python_version < '3.9'"
          python -m py_compile libexec/ccmorph-adapter libexec/model-window \
                               libexec/refresh-model-registry
          python -m pytest tests/ -q

  install-check:
    # The real installer, run as a real user against a throwaway $HOME — not the
    # suite's harness. Catches anything that only shows up on a first install.
    # Each runner is a fresh VM, so on macOS this is the clean-machine check:
    # nothing from the author's Mac (Homebrew extras, ~/.agents, old state).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh python3 curl
      - name: stub the claude CLI (the installer requires it, npm is not the point here)
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\necho "claude 0.0.0-stub"\n' > "$HOME/.local/bin/claude"
          chmod +x "$HOME/.local/bin/claude"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build the gateway-shim binary a checkout installs
        run: make shim
      - name: install non-interactively, then verify what it placed
        run: |
          touch "$HOME/.zshrc"
          ./install.sh </dev/null
          # No shell wiring: the startup file must be untouched.
          grep -qF 'ccmorph' "$HOME/.zshrc" && exit 1
          test -r "$HOME/.config/ccmorph/lib/ccmorph.sh"
          test -x "$HOME/.local/bin/ccmorph"
      - name: the installed gateway-shim starts
        # It prints its listening banner first; it exits on its own once the
        # --parent-pid process is gone.
        run: |
          sleep 5 & parent=$!
          "$HOME/.config/ccmorph/libexec/gateway-shim" 0 http://127.0.0.1:9 --parent-pid=$parent \
            | head -1 | tee /dev/stderr | grep -q '^gateway-shim :[0-9]'
      - name: the command runs in a shell that sourced nothing
        run: sh -c 'ccmorph --version'
      - name: one-line install from a local tarball (remote mode, real curl and tar)
        # The documented one-liner runs install.sh with no source tree beside it.
        # Feed it the same way (`sh -c "$(...)"`, no terminal) and point the download
        # at a tarball of HEAD, so the real fetch, unpack and hand-over run on both
        # runners without touching GitHub. It ends installed, as the steps below expect.
        run: |
          ./install.sh --uninstall
          rm -rf "$HOME/.config/ccmorph"
          mkdir -p "$RUNNER_TEMP/stage"
          # A release tarball carries prebuilt binaries (make dist); stage this
          # runner's one under the per-platform name the installer looks for.
          mkdir -p "$RUNNER_TEMP/stage/ccmorph-main"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/stage/ccmorph-main"
          os=$(uname -s | tr '[:upper:]' '[:lower:]'); arch=$(uname -m)
          case "$arch" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; esac
          cp libexec/gateway-shim "$RUNNER_TEMP/stage/ccmorph-main/libexec/gateway-shim-$os-$arch"
          tar -czf "$RUNNER_TEMP/stage/src.tar.gz" -C "$RUNNER_TEMP/stage" ccmorph-main
          CCMORPH_INSTALL_URL="file://$RUNNER_TEMP/stage/src.tar.gz" sh -c "$(cat install.sh)" </dev/null
          test -r "$HOME/.config/ccmorph/lib/ccmorph.sh"
          test -x "$HOME/.local/bin/ccmorph"
          sh -c 'ccmorph --version'
          test -x "$HOME/.config/ccmorph/libexec/gateway-shim"
      - name: bash and sh must not crash on the installer
        # It is zsh, but people type `bash install.sh`; it must re-exec, not die
        # with a message about a variable that does not exist.
        run: |
          bash ./install.sh
          sh ./install.sh
      - name: uninstall leaves profiles alone
        run: |
          ./install.sh --uninstall
          test -e "$HOME/.local/bin/ccmorph" && exit 1
          test -d "$HOME/.config/ccmorph"

  release-artifact:
    # A release tarball must come from `git archive` at a tag, never a working
    # tree: this project's working directory doubles as its author's live install,
    # so a tree-built tarball would ship real credentials. Prove the artifact is
    # clean on every run, not only at release time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - name: build from HEAD the way make release builds from a tag
        run: |
          git archive --format=tar.gz --prefix=ccmorph/ -o /tmp/probe.tar.gz HEAD
          if tar tzf /tmp/probe.tar.gz \
             | grep -E '\.conf$|/(active|local\.sh|model-registry)$'; then
            echo "release artifact carries live state"; exit 1
          fi
          echo "artifact clean"
