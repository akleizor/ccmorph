[project]
name = "model-router"
version = "0.1.0"
description = "Pick the profile, model and effort for each coding-agent subagent: subscription quota first, then the cheapest model that can do the task."
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
model-router = "model_router.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model_router"]
